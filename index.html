
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas | Gestão Comissão</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              copper: {
                light: '#EBC0A0',
                DEFAULT: '#C5836A',
                dark: '#8C5243',
                metallic: '#B87333',
              },
              city: {
                black: '#050505', 
                dark: '#121212', 
                panel: '#18181b', 
                border: '#27272a' 
              }
            },
            backgroundImage: {
              'copper-gradient': 'linear-gradient(135deg, #dfa67b 0%, #ac6356 100%)',
              'night-gradient': 'linear-gradient(to bottom, #050505, #121212)',
            }
          }
        }
      }
    </script>

    <!-- Babel para transpilação em tempo real (Necessário para GitHub Pages sem build step) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #C5836A;
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react/": "https://esm.sh/react@18.2.0/",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/": "https://esm.sh/react-dom@18.2.0/",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "recharts": "https://esm.sh/recharts@2.12.0?external=react,react-dom",
        "lucide-react": "https://esm.sh/lucide-react@0.330.0?external=react",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.7",
        "@hello-pangea/dnd": "https://esm.sh/@hello-pangea/dnd@16.6.0?external=react,react-dom"
      }
    }
    </script>
  </head>
  <body class="bg-city-black text-gray-300 antialiased selection:bg-copper-DEFAULT selection:text-white">
    <div id="root"></div>
    
    <!-- Carregamento via Babel: Permite que o browser execute o .tsx no GitHub Pages -->
    <script type="text/babel" data-type="module" src="./index.tsx"></script>
  </body>
</html>
