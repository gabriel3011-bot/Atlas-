<!DOCTYPE html>

<body class="bg-city-black text-gray-300 antialiased">

      <input id="senha" type="password" placeholder="Senha"
        class="w-full px-4 py-3 bg-city-dark border border-city-border rounded-lg focus:outline-none focus:ring-1 focus:ring-copper-DEFAULT">

      <button onclick="login()"

</div>

</div>
