<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas 2026 | Quadro Executivo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              copper: {
                light: '#EBC0A0',
                DEFAULT: '#C5836A', // A cor exata do botão
                dark: '#8C5243',
                metallic: '#B87333',
                glow: 'rgba(197, 131, 106, 0.3)'
              },
              city: {
                black: '#050505',    // Fundo preto absoluto
                sidebar: '#0a0a0a',  // Fundo da sidebar levemente diferente
                card: '#101012',     // Fundo dos cards
                border: '#27272a',   // Bordas sutis
                input: '#18181b'
              }
            },
            backgroundImage: {
              'copper-gradient': 'linear-gradient(135deg, #dfa67b 0%, #ac6356 100%)', // Gradiente do botão
              'glass': 'linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%)',
            },
            boxShadow: {
              'glow': '0 0 20px -5px rgba(197, 131, 106, 0.4)',
            }
          }
        }
      }
    </script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body { background-color: #050505; color: #e5e5e5; overflow: hidden; }
      /* Scrollbar personalizada fina */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #C5836A; }
      
      .glass-panel {
        background: rgba(16, 16, 18, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.330.0"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useState } from 'react';
      import { createRoot } from 'react-dom/client';
      import { LayoutGrid, DollarSign, Calendar, Megaphone, FileText, Users, BarChart3, Trophy, Plus, History, Clock } from 'lucide-react';

      // --- Componentes ---

      const Sidebar = ({ activeTab, setActiveTab }) => {
        const menuItems = [
          { id: 'quadro', icon: LayoutGrid, label: 'Quadro' },
          { id: 'financeiro', icon: DollarSign, label: 'Financeiro' },
          { id: 'eventos', icon: Calendar, label: 'Eventos' },
          { id: 'marketing', icon: Megaphone, label: 'Marketing' },
          { id: 'juridico', icon: FileText, label: 'Jurídico' },
          { id: 'membros', icon: Users, label: 'Membros' },
          { id: 'votacoes', icon: BarChart3, label: 'Votações' },
          { id: 'secret', icon: Trophy, label: 'Secret Club' },
        ];

        return (
          <aside className="w-64 h-screen bg-city-sidebar border-r border-city-border flex flex-col fixed left-0 top-0 z-50">
            {/* Logo Area */}
            <div className="h-32 flex flex-col items-center justify-center relative">
               {/* Ícone de cidade estilizado */}
               <div className="mb-2 opacity-80">
                  <svg width="40" height="24" viewBox="0 0 40 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 24V16M12 24V10M20 24V4M28 24V12M36 24V18" stroke="url(#paint0_linear)" strokeWidth="4" strokeLinecap="square"/>
                    <defs>
                      <linearGradient id="paint0_linear" x1="20" y1="4" x2="20" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stopColor="#EBC0A0"/>
                        <stop offset="1" stopColor="#C5836A"/>
                      </linearGradient>
                    </defs>
                  </svg>
               </div>
               <h1 className="text-3xl font-serif font-bold italic tracking-wider text-gray-100">ATLAS</h1>
               <div className="text-[10px] tracking-[0.4em] text-copper mt-1 font-semibold">2026</div>
               
               {/* Linha decorativa abaixo do logo */}
               <div className="absolute bottom-4 w-12 h-[1px] bg-gradient-to-r from-transparent via-copper to-transparent opacity-50"></div>
            </div>

            {/* Menu */}
            <nav className="flex-1 px-4 py-4 space-y-1">
              {menuItems.map((item) => {
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all duration-300 group relative ${
                      isActive 
                        ? 'text-white' 
                        : 'text-gray-500 hover:text-gray-300 hover:bg-white/5'
                    }`}
                  >
                    {/* Fundo Ativo com Glow */}
                    {isActive && (
                      <div className="absolute inset-0 bg-gradient-to-r from-gray-800 to-transparent rounded-xl opacity-40 border-l-2 border-copper"></div>
                    )}
                    
                    <item.icon size={18} className={`relative z-10 transition-colors ${isActive ? 'text-copper' : 'group-hover:text-gray-300'}`} />
                    <span className="relative z-10 text-sm font-medium tracking-wide">{item.label}</span>
                  </button>
                );
              })}
            </nav>

            {/* User Profile Footer */}
            <div className="p-6 border-t border-city-border">
               <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-full border border-city-border bg-city-black flex items-center justify-center text-copper font-serif italic text-lg relative">
                    C
                    <div className="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 rounded-full border-2 border-city-black"></div>
                  </div>
                  <div>
                    <div className="text-sm text-gray-200 font-medium">Comandante</div>
                    <div className="text-[10px] text-copper font-bold tracking-wider">ACESSO MASTER</div>
                  </div>
               </div>
            </div>
          </aside>
        );
      };

      const KanbanCard = ({ tag, tagColor, title, date, priority, priorityColor, avatarLetter, icon }) => (
        <div className="group bg-city-card border border-city-border hover:border-gray-600 rounded-xl p-5 cursor-pointer transition-all duration-300 hover:transform hover:-translate-y-1 hover:shadow-lg relative overflow-hidden">
          {/* Efeito hover sutil */}
          <div className="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>

          <div className="relative z-10">
            {/* Tag */}
            <span className={`inline-block px-2.5 py-1 rounded text-[10px] font-bold tracking-wider uppercase mb-4 ${tagColor} text-white bg-opacity-20 border border-white/10`}>
              {tag}
            </span>

            {/* Title */}
            <h3 className="text-gray-100 font-medium text-[16px] leading-snug mb-8 group-hover:text-copper-light transition-colors">
              {title}
            </h3>

            {/* Footer */}
            <div className="flex items-center justify-between border-t border-white/5 pt-4">
              <div className="flex items-center gap-2 text-gray-500 text-xs font-medium">
                <Calendar size={14} />
                <span>{date}</span>
              </div>
              
              <div className="flex items-center gap-2">
                 <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${priorityColor}`}>
                   {priority}
                 </span>
                 <div className="w-6 h-6 rounded-full bg-gradient-to-b from-gray-700 to-black border border-gray-600 flex items-center justify-center text-[10px] font-bold text-gray-300">
                    {avatarLetter}
                 </div>
              </div>
            </div>
            
            {/* Círculo indicador de status (ex: C, B, A na direita do card na foto) */}
             <div className="absolute right-5 top-5 w-6 h-6 rounded-full bg-city-black border border-city-border flex items-center justify-center text-[10px] text-gray-500 font-bold">
                {avatarLetter}
             </div>
          </div>
        </div>
      );

      const App = () => {
        const [activeTab, setActiveTab] = useState('quadro');
        const [tasks, setTasks] = useState({
          todo: [
            { tag: "ALIMENTAÇÃO", tagColor: "bg-blue-600", title: "Degustação do Buffet", date: "29 DE SET.", priority: "CRITICAL", priorityColor: "border-red-800 text-red-500 bg-red-900/10", avatar: "C" }
          ],
          doing: [
            { tag: "DESIGN", tagColor: "bg-purple-600", title: "Design dos Convites", date: "04 DE AGO.", priority: "MEDIUM", priorityColor: "border-yellow-700 text-yellow-500 bg-yellow-900/10", avatar: "B" }
          ],
          review: [
             { tag: "FINANCEIRO", tagColor: "bg-pink-700", title: "Contatar Patrocinadores", date: "30 DE NOV.", priority: "LOW", priorityColor: "border-green-800 text-green-500 bg-green-900/10", avatar: "A" }
          ],
          done: [
             { tag: "JURÍDICO", tagColor: "bg-rose-600", title: "Contrato do DJ", date: "14 DE OUT.", priority: "MEDIUM", priorityColor: "border-yellow-700 text-yellow-500 bg-yellow-900/10", avatar: "M" }
          ]
        });

        const handleNewTask = () => {
           alert("Funcionalidade de Nova Tarefa seria aberta aqui!");
        };

        return (
          <div className="flex min-h-screen bg-city-black text-gray-300 font-sans selection:bg-copper selection:text-white">
            <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} />
            
            <main className="ml-64 flex-1 flex flex-col h-screen overflow-hidden relative bg-city-black">
              {/* Top Bar Decoration */}
              <div className="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-copper-dark/5 to-transparent pointer-events-none"></div>

              {/* Header */}
              <header className="px-10 py-8 flex items-end justify-between relative z-10">
                <div>
                  <h1 className="font-serif italic text-4xl text-gray-100 mb-2 tracking-tight">Quadro Executivo</h1>
                  <p className="text-gray-500 text-sm tracking-wide">Acompanhamento tático das operações Atlas 2026.</p>
                </div>
                
                <div className="flex gap-4">
                  <button className="px-5 py-2.5 rounded-lg border border-city-border text-gray-400 hover:text-white hover:border-gray-500 hover:bg-white/5 flex items-center gap-2 transition-all text-sm font-medium">
                     <History size={16} />
                     <span>Histórico</span>
                  </button>
                  <button 
                    onClick={handleNewTask}
                    className="px-6 py-2.5 rounded-lg bg-copper-gradient text-white text-sm font-medium shadow-glow hover:shadow-[0_0_30px_-5px_rgba(197,131,106,0.6)] transform hover:-translate-y-0.5 transition-all flex items-center gap-2"
                  >
                     <Plus size={18} />
                     <span>Nova Tarefa</span>
                  </button>
                </div>
              </header>

              {/* Kanban Content */}
              {activeTab === 'quadro' ? (
                <div className="flex-1 overflow-x-auto p-10 pt-4">
                  <div className="flex gap-6 h-full min-w-max pb-4">
                    
                    {/* Column 1 */}
                    <div className="w-[340px] flex flex-col">
                      <div className="flex items-center justify-between mb-6 px-1">
                        <h3 className="font-serif text-xl text-gray-200">A Fazer</h3>
                        <span className="text-[10px] font-bold border border-city-border px-2 py-1 rounded text-gray-500 bg-city-card">{tasks.todo.length} ITENS</span>
                      </div>
                      <div className="space-y-4">
                        {tasks.todo.map((t, i) => <KanbanCard key={i} {...t} avatarLetter={t.avatar} />)}
                      </div>
                    </div>

                    {/* Column 2 */}
                    <div className="w-[340px] flex flex-col">
                      <div className="flex items-center justify-between mb-6 px-1">
                        <h3 className="font-serif text-xl text-gray-200">Em Andamento</h3>
                        <span className="text-[10px] font-bold border border-city-border px-2 py-1 rounded text-gray-500 bg-city-card">{tasks.doing.length} ITENS</span>
                      </div>
                      <div className="space-y-4">
                         {tasks.doing.map((t, i) => <KanbanCard key={i} {...t} avatarLetter={t.avatar} />)}
                      </div>
                    </div>

                    {/* Column 3 */}
                    <div className="w-[340px] flex flex-col">
                      <div className="flex items-center justify-between mb-6 px-1">
                        <h3 className="font-serif text-xl text-gray-200">Revisão</h3>
                        <span className="text-[10px] font-bold border border-city-border px-2 py-1 rounded text-gray-500 bg-city-card">{tasks.review.length} ITENS</span>
                      </div>
                       <div className="space-y-4">
                         {tasks.review.map((t, i) => <KanbanCard key={i} {...t} avatarLetter={t.avatar} />)}
                      </div>
                    </div>

                    {/* Column 4 */}
                    <div className="w-[340px] flex flex-col">
                      <div className="flex items-center justify-between mb-6 px-1">
                        <h3 className="font-serif text-xl text-gray-200">Concluído</h3>
                        <span className="text-[10px] font-bold border border-city-border px-2 py-1 rounded text-gray-500 bg-city-card">{tasks.done.length} ITENS</span>
                      </div>
                       <div className="space-y-4">
                         {tasks.done.map((t, i) => <KanbanCard key={i} {...t} avatarLetter={t.avatar} />)}
                      </div>
                    </div>

                  </div>
                </div>
              ) : (
                <div className="flex-1 flex items-center justify-center text-gray-600 flex-col">
                   <Trophy size={48} className="mb-4 opacity-20" />
                   <p>Módulo {activeTab.charAt(0).toUpperCase() + activeTab.slice(1)} em desenvolvimento...</p>
                </div>
              )}
            </main>
            
            {/* Chat button floating (bottom right) */}
            <div className="fixed bottom-8 right-8 z-50">
               <button className="w-14 h-14 rounded-full bg-copper text-white shadow-glow flex items-center justify-center hover:scale-105 transition-transform">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
               </button>
            </div>
          </div>
        );
      };

      const root = createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
